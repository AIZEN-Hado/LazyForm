<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LazyForm diagrams</title>
<style>body{margin:0;background:#888;display:grid;gap:20px;padding:20px}canvas{display:block}</style></head>
<body>
<!-- Every README graphic is drawn here with the Canvas 2D API, then exported to PNG by render.mjs -->
<script>
const THEMES = {
  light: { bg: '#ffffff', panel: '#f5f5f5', panel2: '#ececec', line: '#e2e2e2', text: '#0a0a0a', text2: '#555555', text3: '#8a8a8a', ink: '#0a0a0a', inkText: '#ffffff', ok: '#16a34a', warn: '#d98a1c', bad: '#d23b42' },
  dark:  { bg: '#0d1117', panel: '#161b22', panel2: '#1f262e', line: '#2b333d', text: '#f2f4f7', text2: '#b4bcc6', text3: '#7d8794', ink: '#f2f4f7', inkText: '#0d1117', ok: '#4ade80', warn: '#f5b84a', bad: '#ff7a7f' },
};
const FONT = 'Inter, "Helvetica Neue", Arial, sans-serif';
const DPR = 2;

function make(id, w, h, t) {
  const c = document.createElement('canvas');
  c.id = id; c.width = w * DPR; c.height = h * DPR; c.style.width = w + 'px';
  document.body.append(c);
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = t.bg; g.fillRect(0, 0, w, h);
  return g;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(g, s, x, y, { size = 16, weight = 500, color, align = 'left', base = 'alphabetic', track = 0 } = {}) {
  g.font = `${weight} ${size}px ${FONT}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  if ('letterSpacing' in g) g.letterSpacing = `${track}px`;
  g.fillText(s, x, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
function orb(g, x, y, r, alpha = 1) {
  g.save(); g.globalAlpha = alpha;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.clip();
  const base = g.createRadialGradient(x, y, 0, x, y, r);
  base.addColorStop(0, '#a6e4ff'); base.addColorStop(1, '#c4b6ff');
  g.fillStyle = base; g.fillRect(x - r, y - r, r * 2, r * 2);
  [[-.38, -.42, .75, '255,211,168'], [.42, -.36, .8, '185,198,255'], [-.1, .5, .85, '255,180,214'], [.45, .4, .6, '199,184,255']].forEach(([dx, dy, s, c]) => {
    const gr = g.createRadialGradient(x + dx * r, y + dy * r, 0, x + dx * r, y + dy * r, r * s);
    gr.addColorStop(0, `rgba(${c},.95)`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  });
  const hi = g.createRadialGradient(x - r * .35, y - r * .4, 0, x - r * .35, y - r * .4, r * .7);
  hi.addColorStop(0, 'rgba(255,255,255,.55)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hi; g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function arrow(g, x1, y1, x2, y2, color, { dash = false, head = 9, width = 1.8, curve = 0 } = {}) {
  g.save(); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = width; g.lineCap = 'round';
  if (dash) g.setLineDash([5, 6]);
  const mx = (x1 + x2) / 2 + curve * (y2 - y1) * -0.25, my = (y1 + y2) / 2 + curve * (x2 - x1) * 0.25;
  g.beginPath(); g.moveTo(x1, y1);
  if (curve) g.quadraticCurveTo(mx, my, x2, y2); else g.lineTo(x2, y2);
  g.stroke(); g.setLineDash([]);
  const a = curve ? Math.atan2(y2 - my, x2 - mx) : Math.atan2(y2 - y1, x2 - x1);
  g.beginPath(); g.moveTo(x2, y2);
  g.lineTo(x2 - head * Math.cos(a - .42), y2 - head * Math.sin(a - .42));
  g.lineTo(x2 - head * Math.cos(a + .42), y2 - head * Math.sin(a + .42));
  g.closePath(); g.fill(); g.restore();
}
function pill(g, x, y, label, t, { dark = false, size = 13 } = {}) {
  g.font = `600 ${size}px ${FONT}`;
  const w = g.measureText(label).width + 26, h = size + 14;
  rr(g, x - w / 2, y - h / 2, w, h, h / 2); g.fillStyle = dark ? t.ink : t.panel2; g.fill();
  text(g, label, x, y + 1, { size, weight: 600, color: dark ? t.inkText : t.text2, align: 'center', base: 'middle' });
}
function check(g, x, y, s, color) {
  g.save(); g.strokeStyle = color; g.lineWidth = s * .16; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - s * .32, y); g.lineTo(x - s * .08, y + s * .26); g.lineTo(x + s * .36, y - s * .26); g.stroke(); g.restore();
}
function box(g, x, y, w, h, t, title, sub, { icon, dark = false, r = 18 } = {}) {
  rr(g, x, y, w, h, r);
  g.fillStyle = dark ? t.ink : t.panel; g.fill();
  if (!dark) { g.strokeStyle = t.line; g.lineWidth = 1; g.stroke(); }
  const tx = icon ? x + 54 : x + 20;
  if (icon) icon(g, x + 30, y + h / 2, dark);
  text(g, title, tx, y + h / 2 - (sub ? 4 : -5), { size: 15.5, weight: 600, color: dark ? t.inkText : t.text, track: -0.2 });
  if (sub) text(g, sub, tx, y + h / 2 + 15, { size: 12.5, weight: 450, color: dark ? (t === THEMES.light ? '#bdbdbd' : '#4a525c') : t.text2 });
}

/* ---------------- symbols ---------------- */
const sym = {
  window: (t) => (g, x, y, dk) => { const c = dk ? t.inkText : t.text; g.save(); g.strokeStyle = c; g.lineWidth = 1.7; rr(g, x - 11, y - 9, 22, 18, 4); g.stroke(); g.beginPath(); g.moveTo(x - 11, y - 3); g.lineTo(x + 11, y - 3); g.stroke(); g.restore(); },
  gear: (t) => (g, x, y, dk) => { const c = dk ? t.inkText : t.text; g.save(); g.strokeStyle = c; g.lineWidth = 1.7; g.beginPath(); g.arc(x, y, 5, 0, 7); g.stroke(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8); g.lineTo(x + Math.cos(a) * 11, y + Math.sin(a) * 11); g.stroke(); } g.restore(); },
  db: (t) => (g, x, y, dk) => { const c = dk ? t.inkText : t.text; g.save(); g.strokeStyle = c; g.lineWidth = 1.7; g.beginPath(); g.ellipse(x, y - 7, 10, 4, 0, 0, 7); g.stroke(); g.beginPath(); g.moveTo(x - 10, y - 7); g.lineTo(x - 10, y + 7); g.ellipse(x, y + 7, 10, 4, 0, Math.PI, 0, true); g.lineTo(x + 10, y - 7); g.stroke(); g.beginPath(); g.ellipse(x, y, 10, 4, 0, 0, Math.PI); g.stroke(); g.restore(); },
  bolt: (t) => (g, x, y, dk) => { g.save(); g.fillStyle = dk ? t.inkText : t.text; g.beginPath(); [[2, -11], [-7, 2], [-1, 2], [-3, 11], [7, -2], [1, -2]].forEach(([a, b], i) => (i ? g.lineTo(x + a, y + b) : g.moveTo(x + a, y + b))); g.closePath(); g.fill(); g.restore(); },
  form: (t) => (g, x, y, dk) => { const c = dk ? t.inkText : t.text; g.save(); g.strokeStyle = c; g.lineWidth = 1.7; rr(g, x - 9, y - 11, 18, 22, 3); g.stroke(); [-4, 1, 6].forEach((d) => { g.beginPath(); g.moveTo(x - 5, y + d); g.lineTo(x + 5, y + d); g.stroke(); }); g.restore(); },
  orb: () => (g, x, y) => orb(g, x, y, 12),
  eye: (t) => (g, x, y, dk) => { const c = dk ? t.inkText : t.text; g.save(); g.strokeStyle = c; g.lineWidth = 1.7; g.beginPath(); g.moveTo(x - 12, y); g.quadraticCurveTo(x, y - 12, x + 12, y); g.quadraticCurveTo(x, y + 12, x - 12, y); g.stroke(); g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill(); g.restore(); },
};

/* ---------------- 1. hero ---------------- */
function hero(t, name) {
  const W = 1600, H = 600, g = make(name, W, H, t);
  // soft orb glow
  const glow = g.createRadialGradient(1170, 300, 0, 1170, 300, 420);
  glow.addColorStop(0, 'rgba(196,182,255,.35)'); glow.addColorStop(.5, 'rgba(255,190,214,.15)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  // dotted grid
  g.fillStyle = t.line;
  for (let x = 40; x < W; x += 32) for (let y = 40; y < H; y += 32) { g.beginPath(); g.arc(x, y, 1.1, 0, 7); g.fill(); }
  orb(g, 1170, 300, 150);
  // floating field cards around the orb
  const cards = [[880, 150, 'First name', 'Riya'], [1300, 110, 'Email', 'riya@…'], [1360, 440, 'Years of experience', '3–5 years'], [870, 430, 'Authorized to work?', 'Yes'], [1390, 275, 'Resume', 'Riya_CV.pdf']];
  cards.forEach(([x, y, l, v]) => {
    g.save(); g.shadowColor = 'rgba(0,0,0,.12)'; g.shadowBlur = 24; g.shadowOffsetY = 8;
    rr(g, x - 95, y - 30, 190, 60, 16); g.fillStyle = t.bg; g.fill(); g.restore();
    rr(g, x - 95, y - 30, 190, 60, 16); g.strokeStyle = t.line; g.stroke();
    text(g, l, x - 78, y - 6, { size: 12, weight: 500, color: t.text3 });
    text(g, v, x - 78, y + 15, { size: 15, weight: 600, color: t.text });
    g.beginPath(); g.arc(x + 70, y, 11, 0, 7); g.fillStyle = t.ok; g.fill(); check(g, x + 70, y, 14, '#fff');
  });
  // headline
  text(g, 'LazyForm', 96, 230, { size: 92, weight: 700, color: t.text, track: -4 });
  text(g, 'Fill in your details once.', 100, 300, { size: 34, weight: 500, color: t.text, track: -1 });
  text(g, 'Every job application fills itself.', 100, 344, { size: 34, weight: 500, color: t.text2, track: -1 });
  pill(g, 160, 430, 'Chrome · Manifest V3', t, { dark: true, size: 14 });
  pill(g, 347, 430, '100% on-device', t, { size: 14 });
  pill(g, 508, 430, 'Never submits', t, { size: 14 });
}

/* ---------------- 2. architecture ---------------- */
function architecture(t, name) {
  const W = 1600, H = 760, g = make(name, W, H, t);
  text(g, 'How the pieces fit', 64, 76, { size: 30, weight: 700, color: t.text, track: -1 });
  text(g, 'Everything runs inside Chrome on your machine. There is no server.', 64, 108, { size: 16, color: t.text2 });
  // browser frame
  rr(g, 48, 140, W - 96, H - 188, 26); g.strokeStyle = t.line; g.lineWidth = 1.5; g.setLineDash([6, 7]); g.stroke(); g.setLineDash([]);
  pill(g, 150, 140, 'Your Chrome profile', t, { size: 12.5 });

  const A = [110, 210, 330, 92], B = [110, 340, 330, 92], C = [110, 470, 330, 92];
  box(g, ...A, t, 'Toolbar popup', 'Start / Stop auto-apply · Fill once', { icon: sym.window(t) });
  box(g, ...B, t, 'Setup page', 'Profile, resume, saved answers', { icon: sym.form(t) });
  box(g, ...C, t, 'Keyboard shortcuts', 'Alt+Shift+F · Alt+Shift+Y', { icon: sym.bolt(t) });

  const BG = [610, 300, 360, 120];
  box(g, ...BG, t, 'Background worker', 'Tracks auto-apply sessions per tab', { icon: sym.gear(t), dark: true, r: 22 });
  const ST = [610, 540, 360, 96];
  box(g, ...ST, t, 'chrome.storage.local', 'Your profile never leaves it', { icon: sym.db(t) });

  const P = [1120, 190, 400, 480];
  rr(g, ...P, 22); g.fillStyle = t.panel; g.fill(); g.strokeStyle = t.line; g.stroke();
  text(g, 'Job application tab', 1146, 228, { size: 15.5, weight: 600, color: t.text });
  text(g, 'Scripts injected only when you ask', 1146, 250, { size: 12.5, color: t.text2 });
  box(g, 1146, 278, 348, 84, t, 'filler.js', 'detect → understand → match → fill', { icon: sym.eye(t) });
  box(g, 1146, 378, 348, 84, t, 'session.js', 'watches for new steps & pages', { icon: sym.orb(t) });
  // fake form rows
  [490, 530, 570, 610].forEach((y, i) => {
    rr(g, 1146, y, 348, 30, 10); g.fillStyle = t.bg; g.fill(); g.strokeStyle = t.line; g.stroke();
    rr(g, 1160, y + 11, [120, 160, 90, 140][i], 8, 4); g.fillStyle = t.panel2; g.fill();
    g.beginPath(); g.arc(1474, y + 15, 8, 0, 7); g.fillStyle = i < 3 ? t.ok : t.warn; g.fill();
    if (i < 3) check(g, 1474, y + 15, 10, '#fff'); else text(g, '!', 1474, y + 16, { size: 11, weight: 700, color: '#fff', align: 'center', base: 'middle' });
  });

  const c = t.text3;
  arrow(g, 440, 256, 610, 340, c, { curve: .25 });
  arrow(g, 440, 516, 610, 380, c, { curve: -.25 });
  arrow(g, 440, 386, 610, 588, c, { curve: -.2, dash: true });
  arrow(g, 790, 420, 790, 540, c);
  arrow(g, 970, 330, 1120, 320, c);
  arrow(g, 1120, 440, 970, 400, c, { dash: true });
  text(g, 'inject + start', 1000, 312, { size: 12, weight: 500, color: t.text3 });
  text(g, 'progress', 1012, 444, { size: 12, weight: 500, color: t.text3 });
  text(g, 'reads profile', 802, 488, { size: 12, weight: 500, color: t.text3 });
  text(g, 'saves', 470, 520, { size: 12, weight: 500, color: t.text3 });
}

/* ---------------- 3. fill pipeline ---------------- */
function pipeline(t, name) {
  const W = 1600, H = 470, g = make(name, W, H, t);
  text(g, 'What happens when a form is filled', 64, 76, { size: 30, weight: 700, color: t.text, track: -1 });
  text(g, 'Five passes over every field, in milliseconds.', 64, 108, { size: 16, color: t.text2 });
  const steps = [
    ['01', 'Detect', 'inputs, selects, radios,\ncomboboxes, shadow DOM'],
    ['02', 'Understand', 'labels, aria, placeholder,\nnearby text, section'],
    ['03', 'Match', '60+ field rules, ranges,\nyes/no, saved answers'],
    ['04', 'Fill', 'native setters + events so\nReact & Workday notice'],
    ['05', 'Review', 'green = filled\namber = needs you'],
  ];
  const w = 268, gap = 28, x0 = 64, y = 170, h = 230;
  steps.forEach(([n, title, sub], i) => {
    const x = x0 + i * (w + gap);
    rr(g, x, y, w, h, 22); g.fillStyle = i === 4 ? t.ink : t.panel; g.fill();
    const fg = i === 4 ? t.inkText : t.text, fg2 = i === 4 ? (t === THEMES.light ? '#bdbdbd' : '#4a525c') : t.text2;
    text(g, n, x + 24, y + 44, { size: 14, weight: 600, color: i === 4 ? fg2 : t.text3, track: 1 });
    // symbol
    const sx = x + w - 46, sy = y + 40;
    if (i === 0) { g.strokeStyle = fg; g.lineWidth = 2; g.beginPath(); g.arc(sx - 3, sy - 3, 10, 0, 7); g.stroke(); g.beginPath(); g.moveTo(sx + 5, sy + 5); g.lineTo(sx + 13, sy + 13); g.stroke(); }
    if (i === 1) sym.eye(t)(g, sx, sy, i === 4);
    if (i === 2) { g.strokeStyle = fg; g.lineWidth = 2; [[-8, 0], [8, 0]].forEach(([d]) => { g.beginPath(); g.arc(sx + d, sy, 8, 0, 7); g.stroke(); }); }
    if (i === 3) sym.bolt(t)(g, sx, sy, false);
    if (i === 4) orb(g, sx, sy, 15);
    text(g, title, x + 24, y + 120, { size: 28, weight: 650, color: fg, track: -1 });
    sub.split('\n').forEach((l, k) => text(g, l, x + 24, y + 156 + k * 21, { size: 14.5, color: fg2 }));
    if (i < 4) arrow(g, x + w + 4, y + h / 2, x + w + gap - 4, y + h / 2, t.text3, { head: 7 });
  });
}
