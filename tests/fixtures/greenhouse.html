<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply – Acme (Greenhouse-style)</title>
<style>body{font:14px system-ui;max-width:720px;margin:24px auto} .field{margin:12px 0} label{display:block;font-weight:600}</style></head>
<body>
<h1>Senior Software Engineer</h1>
<form id="application_form" onsubmit="window.__submitted=(window.__submitted||0)+1;return false;">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" type="text" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="job_application[email]" type="text" required></div>
  <div class="field"><label for="phone">Phone *</label><input id="phone" name="job_application[phone]" type="text" required></div>
  <div class="field"><label for="job_application_location">Location (City) *</label><input id="job_application_location" name="job_application[location]" type="text"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div>
  <div class="field"><label for="q1">LinkedIn Profile</label><input id="q1" name="job_application[answers_attributes][0][text_value]" type="text"></div>
  <div class="field"><label for="q2">Website</label><input id="q2" name="job_application[answers_attributes][1][text_value]" type="text"></div>
  <div class="field"><label for="q3">Are you legally authorized to work in the country this job is located in? *</label>
    <select id="q3" name="job_application[answers_attributes][2][boolean_value]" required><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q4">Will you now or in the future require sponsorship for employment visa status? *</label>
    <select id="q4" name="job_application[answers_attributes][3][boolean_value]"><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q5">Why do you want to work at Acme? *</label><textarea id="q5" name="job_application[answers_attributes][4][text_value]" required></textarea></div>
  <div class="field"><label for="q6">What is your favourite programming language?</label><input id="q6" name="job_application[answers_attributes][5][text_value]" type="text"></div>
  <div class="field"><label for="q7">Current Company</label><input id="q7" name="job_application[answers_attributes][6][text_value]" type="text"></div>
  <div class="field"><label for="q8">Expected salary (annual)</label><input id="q8" name="job_application[answers_attributes][7][text_value]" type="text"></div>
  <h2>Voluntary Self-Identification</h2>
  <div class="field"><label for="gender">Gender</label><select id="gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="hispanic">Are you Hispanic/Latino?</label><select id="hispanic" name="job_application[hispanic_ethnicity]"><option value="">Please select</option><option value="Yes">Yes</option><option value="No">No</option><option value="Decline">Decline To Self Identify</option></select></div>
  <div class="field"><label for="veteran">Veteran Status</label><select id="veteran" name="job_application[veteran_status]"><option value="">Please select</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of protected veteran</option><option value="3">I don't wish to answer</option></select></div>
  <div class="field"><label for="disability">Disability Status</label><select id="disability" name="job_application[disability_status]"><option value="">Please select</option><option value="1">Yes, I have a disability, or have had one in the past</option><option value="2">No, I do not have a disability and have not had one in the past</option><option value="3">I do not want to answer</option></select></div>
  <div class="field"><label><input type="checkbox" id="consent" name="consent" required> I agree to the privacy policy and certify my answers are true.</label></div>
  <div style="position:absolute;left:-9999px"><label for="trap1">Address</label><input id="trap1" name="trap_address"></div>
  <div style="opacity:0"><label for="trap2">Date of birth</label><input id="trap2" name="trap_dob"></div>
  <button type="submit">Submit Application</button>
</form>
</body></html>
