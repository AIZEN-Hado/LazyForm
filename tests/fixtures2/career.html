<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Globex Careers – Apply</title>
<style>body{font:14px system-ui;max-width:760px;margin:24px auto}.f{margin:10px 0}label{display:block;font-weight:600}.block{border:1px solid #ddd;padding:10px;margin:8px 0}[hidden]{display:none}</style></head>
<body><h1>Backend Engineer – Globex</h1>
<form id="app" onsubmit="window.__submitted=(window.__submitted||0)+1;return false;">
<div id="step1"><h2>Step 1 of 3 · About you</h2>
  <div class="f"><label for="fn">First name *</label><input id="fn" required></div>
  <div class="f"><label for="ln">Last name *</label><input id="ln" required></div>
  <div class="f"><label for="em">Email *</label><input id="em" type="email" required></div>
  <div class="f"><label for="ph">Phone *</label><input id="ph" type="tel"></div>
  <button type="button" id="next1">Next</button></div>

<div id="step2" hidden><h2>Step 2 of 3 · Background</h2>
  <section id="exp"><h3>Work experience</h3>
    <div class="block"><div class="f"><label for="t0">Job title</label><input id="t0"></div><div class="f"><label for="c0">Company</label><input id="c0"></div>
      <div class="f"><label for="s0">From</label><input id="s0" type="month"></div><div class="f"><label for="e0">To</label><input id="e0" type="month"></div>
      <div class="f"><label><input type="checkbox" id="cur0"> I currently work here</label></div></div>
    <div class="block"><div class="f"><label for="t1">Job title</label><input id="t1"></div><div class="f"><label for="c1">Company</label><input id="c1"></div>
      <div class="f"><label for="s1">From</label><input id="s1" type="month"></div><div class="f"><label for="e1">To</label><input id="e1" type="month"></div>
      <div class="f"><label><input type="checkbox" id="cur1"> I currently work here</label></div></div>
    <button type="button" id="addexp">+ Add another</button>
  </section>
  <section><h3>Education</h3>
    <div class="block"><div class="f"><label for="sch">School or university</label><input id="sch"></div><div class="f"><label for="deg">Degree</label><input id="deg"></div>
    <div class="f"><label for="fos">Field of study</label><input id="fos"></div></div>
  </section>
  <button type="button" id="next2">Next</button></div>

<div id="step3" hidden><h2>Step 3 of 3 · Questions</h2>
  <div class="f"><label for="auth">Are you legally authorized to work in India?</label>
    <select id="auth"><option value="">Select</option><option value="n">I am not authorized to work in India</option><option value="y">I am authorized to work in India</option></select></div>
  <fieldset><legend>Will you require visa sponsorship?</legend>
    <label><input type="radio" name="sp" value="y"> Yes, I will require sponsorship</label>
    <label><input type="radio" name="sp" value="n"> No, I will not require sponsorship</label></fieldset>
  <div class="f"><label for="why">Why do you want to work at Globex?</label><textarea id="why"></textarea></div>
  <div class="f"><label for="why2">Why do you want to work here?</label><textarea id="why2"></textarea></div>
  <div class="f"><label for="sd">Earliest start date</label><input id="sd" type="text"></div>
  <div class="f"><label for="ssn">PAN card number</label><input id="ssn"></div>
  <a id="cont" href="career2.html">Continue to page 2</a></div>
</form>
<script>
const show=(a,b)=>{document.getElementById(a).hidden=true;document.getElementById(b).hidden=false;};
next1.onclick=()=>show('step1','step2'); next2.onclick=()=>show('step2','step3');
let n=2; addexp.onclick=()=>{const d=document.createElement('div');d.className='block';d.innerHTML=`<div class="f"><label for="t${n}">Job title</label><input id="t${n}"></div><div class="f"><label for="c${n}">Company</label><input id="c${n}"></div>`;addexp.before(d);n++;};
</script></body></html>
